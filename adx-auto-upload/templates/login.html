<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ADX-Auto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-card .card-body {
            padding: 2.5rem;
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .brand-logo i {
            font-size: 1.8rem;
        }
        .login-card .form-control {
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border-radius: 0.5rem;
        }
        .login-card .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        .btn-login {
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="card-body text-center">
            <!-- 品牌标识 -->
            <div class="brand-logo mb-2">
                <i class="bi bi-rocket-takeoff me-2"></i>ADX-Auto
            </div>
            <p class="text-muted mb-4">Google Ads 自动化投放管理平台</p>

            <!-- 登录表单 -->
            {% if error_message %}
            <div class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>{{ error_message }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label fw-semibold">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label fw-semibold">密码</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>登录
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
